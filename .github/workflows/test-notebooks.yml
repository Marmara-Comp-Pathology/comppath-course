# Run every lesson end to end on tiny synthetic data (CPU only), once a month and on demand.
# If the scheduled run fails, open an issue (or comment on the open one) so a maintainer notices.
name: Test notebooks

on:
  schedule:
    - cron: "17 5 1 * *"   # 05:17 UTC on the 1st of every month
  workflow_dispatch:
  pull_request:
    paths:
      - "lessons/**"
      - "environment.txt"
      - "tests/run_notebooks.py"
      - ".github/workflows/test-notebooks.yml"

permissions:
  contents: read
  issues: write

jobs:
  run-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: environment.txt

      # CPU-only PyTorch first (much smaller than the default CUDA build), then everything else.
      - name: Install pinned packages
        run: |
          python -m pip install --upgrade pip
          grep -E '^(torch|torchvision)==' environment.txt > torch-requirements.txt
          pip install -r torch-requirements.txt --index-url https://download.pytorch.org/whl/cpu
          pip install -r environment.txt

      - name: Run lessons in smoke-test mode
        run: python tests/run_notebooks.py

      - name: Add results to the job summary
        if: always()
        run: cat test-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Open or update an issue
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label="notebook-test-failure"
          {
            echo "The notebook test run on $(date -u +%Y-%m-%d) failed. Run: $RUN_URL"
            echo
            cat test-report.md 2>/dev/null || echo "No report was written; see the run log."
          } > issue-body.md
          gh label create "$label" --color B60205 --description "Automated notebook test failed" --force
          existing=$(gh issue list --state open --label "$label" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue-body.md
          else
            gh issue create --title "Notebook tests failed" --label "$label" --body-file issue-body.md
          fi
